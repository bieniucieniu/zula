[project]
name = "zula"
revision = "1.0"

# Values come from `.env` via devenv secretspec provider=dotenv (see devenv.yaml).
[profiles.default]
APP_URL = { description = "Public HTTP origin for OAuth callbacks and JWT issuer", required = true }
API_URL = { description = "REST API base URL for clients", required = false, default = "http://localhost:8000/api/v1" }

DATABASE_JDBC_URL = { description = "PostgreSQL JDBC URL", required = true }
DATABASE_USERNAME = { description = "PostgreSQL username", required = true }
DATABASE_PASSWORD = { description = "PostgreSQL password", required = true }
DATABASE_MAX_POOL_SIZE = { description = "HikariCP max pool size", required = false, default = "10" }
AUTO_MIGRATE = { description = "Run SQLDelight migrations on startup", required = false, default = "true" }

JWT_AUDIENCE = { description = "JWT aud claim", required = false, default = "zula" }
JWT_REALM = { description = "JWT realm", required = false, default = "Zula" }
JWT_AUTO_GENERATE_KEY = { description = "Generate ephemeral RSA keys when PEMs absent (dev only; default false in server yaml)", required = false, default = "true" }
JWT_SIGNING_ENABLED = { description = "Enable JWT signing on this instance", required = false, default = "true" }
JWT_KEY_ID = { description = "Default JWT kid", required = false, default = "default" }
JWT_ACCESS_TOKEN_TTL_SECONDS = { description = "Access token TTL", required = false, default = "900" }
JWT_REFRESH_TOKEN_TTL_SECONDS = { description = "Refresh token TTL", required = false, default = "2592000" }
JWT_PRIVATE_KEY_PEM = { description = "RSA private key PEM (optional if auto-generate)", required = false }
JWT_PUBLIC_KEY_PEM = { description = "RSA public key PEM", required = false }
JWT_KEYS = { description = "JSON JWT key set", required = false }
PROVIDER_TOKEN_ENCRYPTION_KEY = { description = "AES key material for provider token encryption", required = true }

JWT_K8S_ENABLED = { description = "Load/store JWT keys via Kubernetes Secret", required = false, default = "false" }
JWT_K8S_NAMESPACE = { description = "K8s namespace for JWT secret", required = false }
JWT_K8S_SECRET_NAME = { description = "K8s secret name for JWT keys", required = false, default = "zula-jwt-keys" }
JWT_K8S_AUTO_PULL = { description = "Pull JWT secret on startup", required = false, default = "true" }
JWT_K8S_AUTO_PUSH = { description = "Push generated JWT keys to K8s", required = false, default = "false" }

# devenv.nix always enables dev bypass; override here or set empty to disable.
# When set, `dev` appears on GET /api/auth/providers (clientId = secret for local clients).
AUTH_DEV_BYPASS_SECRET = { description = "Local-only dev auth bypass secret (server; listed on /auth/providers)", required = false, default = "local-dev-bypass" }
AUTH_DEV_BYPASS_EMAIL = { description = "Fixed email for dev auth bypass", required = false, default = "dev@zula.local" }

GOOGLE_CLIENT_ID = { description = "Google OAuth client ID", required = false }
GOOGLE_CLIENT_SECRET = { description = "Google OAuth client secret", required = false }
APPLE_CLIENT_ID = { description = "Apple OAuth client ID (Services ID)", required = false }
APPLE_TEAM_ID = { description = "Apple Developer Team ID", required = false }
APPLE_KEY_ID = { description = "Apple Sign In key ID", required = false }
APPLE_PRIVATE_KEY = { description = "Apple Sign In private key PEM", required = false }

JOBRUNR_DASHBOARD = { description = "Enable JobRunr dashboard web UI", required = false, default = "false" }
JOBRUNR_DASHBOARD_PORT = { description = "JobRunr dashboard port", required = false, default = "8008" }

KTOR_DEVELOPMENT = { description = "Ktor development mode defualt (true)", required = false, default = "true" }
LOG_LEVEL = { description = "Ktor request log level ()", required = false, default = "trace" }

S3_ENDPOINT = { description = "S3/SeaweedFS endpoint for server (path-style)", required = false, default = "http://127.0.0.1:8333" }
S3_PUBLIC_URL = { description = "Browser-facing S3/SeaweedFS base URL", required = false, default = "http://127.0.0.1:8333" }
S3_BUCKET = { description = "S3/SeaweedFS bucket name", required = false, default = "zula" }
S3_ACCESS_KEY = { description = "S3/SeaweedFS access key", required = false, default = "zula" }
S3_SECRET_KEY = { description = "S3/SeaweedFS secret key", required = false, default = "zulazula" }
S3_REGION = { description = "S3 region (SeaweedFS ignores; required by SDK)", required = false, default = "us-east-1" }
S3_ENABLED = { description = "Enable object storage client", required = false, default = "true" }