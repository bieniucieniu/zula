database:
  jdbcUrl: ${DATABASE_JDBC_URL:}
  username: ${DATABASE_USERNAME:zula}
  password: ${DATABASE_PASSWORD:zula}
  maximumPoolSize: ${DATABASE_MAX_POOL_SIZE:10}
  autoMigrate: ${AUTO_MIGRATE:true}

jobrunr:
  dashboardEnabled: ${JOBRUNR_DASHBOARD:false}
  dashboardPort: ${JOBRUNR_DASHBOARD_PORT:8008}

security:
  appUrl: ${APP_URL:}
  cookies:
    secure: ${AUTH_COOKIE_SECURE:true}
  jwt:
    audience: ${JWT_AUDIENCE:zula}
    realm: ${JWT_REALM:Zula}
    autoGenerateKey: ${JWT_AUTO_GENERATE_KEY:false}
    keysJson: ${JWT_KEYS:}
    privateKeyPem: ${JWT_PRIVATE_KEY_PEM:}
    publicKeyPem: ${JWT_PUBLIC_KEY_PEM:}
    signingEnabled: ${JWT_SIGNING_ENABLED:true}
    defaultKeyId: ${JWT_KEY_ID:default}
    accessTokenTtlSeconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refreshTokenTtlSeconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
    providerTokenEncryptionKey: ${PROVIDER_TOKEN_ENCRYPTION_KEY:}
    kubernetes:
      enabled: ${JWT_K8S_ENABLED:false}
      namespace: ${JWT_K8S_NAMESPACE:}
      secretName: ${JWT_K8S_SECRET_NAME:zula-jwt-keys}
      autoPull: ${JWT_K8S_AUTO_PULL:true}
      autoPush: ${JWT_K8S_AUTO_PUSH:false}
  oauth:
    google:
      clientId: ${GOOGLE_CLIENT_ID:}
      clientSecret: ${GOOGLE_CLIENT_SECRET:}
      additionalClientIds: ${GOOGLE_ADDITIONAL_CLIENT_IDS:}
    apple:
      clientId: ${APPLE_CLIENT_ID:}
      teamId: ${APPLE_TEAM_ID:}
      keyId: ${APPLE_KEY_ID:}
      privateKeyPem: ${APPLE_PRIVATE_KEY:}
      additionalClientIds: ${APPLE_ADDITIONAL_CLIENT_IDS:}
  devAuth:
    secret: ${AUTH_DEV_BYPASS_SECRET:}
    defaultEmail: ${AUTH_DEV_BYPASS_EMAIL:dev@zula.local}
  auth:
    providerCheckIntervalSeconds: ${AUTH_PROVIDER_CHECK_INTERVAL_SECONDS:21600}
    requireProviderRefreshOnLogin: ${AUTH_REQUIRE_PROVIDER_REFRESH_ON_LOGIN:true}
    appleCodeFlowEnabled: ${AUTH_APPLE_CODE_FLOW_ENABLED:false}

ktor:
  deployment:
    port: 8000
    watch:
      - classes
  development: true
  application:
    modules:
      - com.zula.app.KoinKt.configureKoin
      - com.zula.core.http.HttpKt.configureHttp
      - com.zula.core.http.SerializationKt.configureSerialization
      - com.zula.core.openapi.OpenApiKt.configureOpenApi
      - com.zula.core.database.DatabaseKt.configureDatabase
      - com.zula.core.health.HealthKt.configureHealth
      - com.zula.core.jobrunr.JobRunrKt.configureJobRunr
      - com.zula.core.security.SecurityKt.configureSecurity
      - com.zula.app.RoutingKt.configureRouting