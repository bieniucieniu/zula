# Postgres + PowerSync only — no devenv required.
# Ktor (:8000) still needed separately for JWKS + migrations.
#
#   docker compose -f docker/docker-compose.yaml up
#   docker compose -f docker/docker-compose.yaml down -v   # wipe data
#
# Env: repo-root .env (same vars as devenv secretspec). Defaults match secretspec.toml.
services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-zula}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-zula}
      POSTGRES_DB: zula
      PS_REPLICATION_PASSWORD: ${PS_REPLICATION_PASSWORD:-powersync}
      PS_STORAGE_USERNAME: ${PS_STORAGE_USERNAME:-powersync}
      PS_STORAGE_PASSWORD: ${PS_STORAGE_PASSWORD:-powersync}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - listen_addresses=*
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d zula"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: postgresql://powersync_role:${PS_REPLICATION_PASSWORD:-powersync}@postgres:5432/zula
      PS_STORAGE_URI: postgresql://${PS_STORAGE_USERNAME:-powersync}:${PS_STORAGE_PASSWORD:-powersync}@postgres:5432/zula_powersync
      PS_JWKS_URI: ${PS_JWKS_URI:-http://host.docker.internal:8000/.well-known/jwks.json}
    volumes:
      - ../powersync/service.yaml:/config/service.yaml:ro
      - ../powersync/sync-config.yaml:/config/sync-config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8080/probes/readiness || wget -q -O- http://127.0.0.1:8080/probes/readiness || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
