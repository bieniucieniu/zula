deploy/k8s/jwt-keys-secret.example.yaml
# Example only — generate a real manifest with:
#   ./gradlew :server:generateJwtK8sSecret -PjwtSecretNamespace=zula -PjwtSecretName=zula-jwt-keys \
#     > deploy/k8s/zula-jwt-keys.secret.yaml
#
# Apply in the app namespace (GitOps repo in production):
#   kubectl apply -f deploy/k8s/zula-jwt-keys.secret.yaml
#
# Mount into the backend Deployment:
#   envFrom:
#     - secretRef:
#         name: zula-jwt-keys
apiVersion: v1
kind: Secret
metadata:
  name: zula-jwt-keys
  namespace: zula
type: Opaque
stringData:
  JWT_PRIVATE_KEY_PEM: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
  JWT_PUBLIC_KEY_PEM: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_ME
    -----END PUBLIC KEY-----
  JWT_AUTO_GENERATE_KEY: "false"
