deploy/k8s/jwt-keys-secret.example.yaml
# Example only — replace REPLACE_ME with real PEMs (e.g. openssl genrsa 2048).
# Or let the backend bootstrap at runtime: JWT_K8S_ENABLED=true, JWT_K8S_AUTO_PUSH=true
# once, then disable autoPush. K8s API is used only from the running app (KeysManager).
#
# Apply in the app namespace (GitOps repo in production):
#   kubectl apply -f deploy/k8s/zula-jwt-keys.secret.yaml
#
# Mount into the backend Deployment:
#   envFrom:
#     - secretRef:
#         name: zula-jwt-keys
apiVersion: v1
kind: Secret
metadata:
  name: zula-jwt-keys
  namespace: zula
type: Opaque
stringData:
  JWT_PRIVATE_KEY_PEM: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
  JWT_PUBLIC_KEY_PEM: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_ME
    -----END PUBLIC KEY-----
  JWT_AUTO_GENERATE_KEY: "false"
