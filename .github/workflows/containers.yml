name: Containers

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  # Fat JAR is arch-independent; build once on amd64, then bake into multi-arch JRE images.
  # Platforms: linux/amd64 (x64) + linux/arm64 (Apple Silicon, Raspberry Pi 4 / ARMv8).
  server-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build server shadow JAR
        run: ./gradlew :server:shadowJar --no-daemon -x test

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-all-jar
          path: server/build/libs/server-all.jar
          if-no-files-found: error
          retention-days: 7

  server-image:
    needs: server-jar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server JAR
        uses: actions/download-artifact@v4
        with:
          name: server-all-jar
          path: .ci-docker/server

      - name: Prepare build context
        run: |
          test -f .ci-docker/server/server-all.jar
          cp docker/server/Dockerfile .ci-docker/server/Dockerfile

      - name: Lowercase image name
        run: |
          owner_repo="${{ github.repository }}"
          echo "IMAGE_NAME=${REGISTRY}/${owner_repo,,}/server" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .ci-docker/server
          file: .ci-docker/server/Dockerfile
          target: runtime-prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=zula-server
          cache-to: type=gha,mode=max,scope=zula-server
          provenance: false
