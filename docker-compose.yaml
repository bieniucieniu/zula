services:
  pg-db:
    env_file:
      - .env
    image: pgvector/pgvector:pg18
    restart: always
    command: ["postgres", "-c", "log_statement=all", "-c", "log_duration=on"]
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_DB=zula
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DATABASE_USERNAME} -d zula
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs-config:
    image: busybox:1.37.0
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-zula}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-zulazula}
    volumes:
      - seaweedfs_config:/config
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        cat > /config/s3.json <<EOF
        {
          "identities": [
            {
              "name": "zula",
              "credentials": [
                {
                  "accessKey": "$$S3_ACCESS_KEY",
                  "secretKey": "$$S3_SECRET_KEY"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF

  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    restart: always
    depends_on:
      seaweedfs-config:
        condition: service_completed_successfully
    command:
      - server
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3-config/s3.json
    volumes:
      - seaweedfs_data:/data
      - seaweedfs_config:/etc/seaweedfs/s3-config:ro
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  seaweedfs-init:
    image: chrislusf/seaweedfs:4.45
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-zula}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "s3.bucket.create -name $$S3_BUCKET" | weed -logtostderr=true shell -master=seaweedfs:9333
        echo seaweedfs-init done

volumes:
  pg_data:
  seaweedfs_data:
  seaweedfs_config:
