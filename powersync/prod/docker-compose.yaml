# Prod PowerSync — reference only. Real deploy is Kubernetes (GitOps).
# Inject PS_* via Secret/ConfigMap; mount service.yaml + sync-config.yaml.
#
# Required env:
#   PS_DATA_SOURCE_URI      postgresql://…  (app DB, replication role)
#   PS_DATA_SOURCE_SSLMODE  prefer | require | disable
#   PS_STORAGE_URI          postgresql://…  (bucket storage DB)
#   PS_STORAGE_SSLMODE      prefer | require | disable
#   PS_JWKS_URI             https://…/.well-known/jwks.json
services:
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    ports:
      - "8081:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI:?set PS_DATA_SOURCE_URI}
      PS_DATA_SOURCE_SSLMODE: ${PS_DATA_SOURCE_SSLMODE:-require}
      PS_STORAGE_URI: ${PS_STORAGE_URI:?set PS_STORAGE_URI}
      PS_STORAGE_SSLMODE: ${PS_STORAGE_SSLMODE:-require}
      PS_JWKS_URI: ${PS_JWKS_URI:?set PS_JWKS_URI}
    volumes:
      - ./service.yaml:/config/service.yaml:ro
      - ../sync-config.yaml:/config/sync-config.yaml:ro
