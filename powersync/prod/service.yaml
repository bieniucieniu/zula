# Prod PowerSync Service — values from env (k8s Secret / ConfigMap).
# Do not hardcode credentials here. Deploy via GitOps / k8s, not this compose
# (compose is only a smoke-test reference for the image + env contract).
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: !env PS_DATA_SOURCE_SSLMODE

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: !env PS_STORAGE_SSLMODE

port: 8080

client_auth:
  jwks_uri: !env PS_JWKS_URI
  audience:
    - zula

sync_config:
  path: /config/sync-config.yaml

telemetry:
  disable_telemetry_sharing: true
