# Dev PowerSync Service — URIs from env (compose injects secretspec PS_*).
# Prod: see ../prod/service.yaml (k8s).
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

# Container listens on 8080; host maps 8081:8080 (must match PS_URL).
port: 8080

client_auth:
  jwks_uri: !env PS_JWKS_URI
  audience:
    - zula

sync_config:
  path: /config/sync-config.yaml

telemetry:
  disable_telemetry_sharing: true
