# Dev PowerSync Service. URIs hardcoded in ./service.yaml.
# Needs: devenv postgres (wal_level=logical + initialSQL), Ktor JWKS on :8080.
# Always recreate/remove the container (PowerSync caches config across restarts).
services:
  powersync:
    image: journeyapps/powersync-service:latest
    restart: "no"
    command: ["start", "-r", "unified"]
    ports:
      - "8081:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
    volumes:
      - ./service.yaml:/config/service.yaml:ro
      - ../sync-config.yaml:/config/sync-config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8080/probes/readiness || wget -q -O- http://127.0.0.1:8080/probes/readiness || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
