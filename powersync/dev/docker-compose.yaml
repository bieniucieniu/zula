# Dev PowerSync Service.
# Injects PS_* into the container from secretspec (defaults match secretspec.toml).
# Needs: devenv postgres (wal_level=logical + initialSQL), Ktor JWKS on :8080.
# Always recreate/remove the container (PowerSync caches config across restarts).
services:
  powersync:
    image: journeyapps/powersync-service:latest
    restart: "no"
    command: ["start", "-r", "unified"]
    ports:
      # Keep in sync with secretspec PS_URL default (http://127.0.0.1:8081).
      - "8081:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      # Built from PS_* (host env via devenv secretspec). Defaults = secretspec.toml.
      PS_DATA_SOURCE_URI: postgresql://powersync_role:${PS_REPLICATION_PASSWORD:-powersync}@host.docker.internal:5432/zula
      PS_STORAGE_URI: postgresql://${PS_STORAGE_USERNAME:-powersync}:${PS_STORAGE_PASSWORD:-powersync}@host.docker.internal:5432/zula_powersync
      PS_JWKS_URI: ${PS_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
    volumes:
      - ./service.yaml:/config/service.yaml:ro
      - ../sync-config.yaml:/config/sync-config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8080/probes/readiness || wget -q -O- http://127.0.0.1:8080/probes/readiness || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
