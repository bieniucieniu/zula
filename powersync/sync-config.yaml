# Sync Streams — source of truth for what clients may sync.
# Client schema: `bun run gen` in packages/powersync (needs PowerSync up).
#
# Lazy vs leftover profiles:
# - `me` is auto_subscribe (own row only — always small).
# - `user_profile` is on-demand: client must subscribe with user_id.
# - After unsubscribe, SDK keeps rows for TTL (default 24h), then drops them.
#   Use subscribe({ ttl: 0 }) to purge immediately; never auto_subscribe all profiles.

config:
  edition: 3

streams:
  # Own user + profile — always available offline after connect.
  me:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT id, username FROM users WHERE id = auth.user_id()
      # user_profiles PK is user_id; PowerSync requires column `id`
      - |
        SELECT
          user_id AS id,
          display_name,
          avatar_url,
          bio,
          timezone,
          preferred_language,
          location_tag,
          seller_headline,
          updated_at
        FROM user_profiles
        WHERE user_id = auth.user_id()

  # Other users' public profiles — subscribe per user when screen opens.
  # NOT auto_subscribe: avoids syncing every viewed profile forever.
  user_profile:
    accept_potentially_dangerous_queries: true
    queries:
      - SELECT id, username FROM users WHERE id = subscription.parameter('user_id')
      - |
        SELECT
          user_id AS id,
          display_name,
          avatar_url,
          bio,
          timezone,
          preferred_language,
          location_tag,
          seller_headline,
          updated_at
        FROM user_profiles
        WHERE user_id = subscription.parameter('user_id')
