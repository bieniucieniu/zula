# PowerSync Service config (self-hosted). Env vars from docker-compose / .env.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

# Container listens on 8080; host maps 8081:8080 (Ktor owns 8080).
port: 8080

client_auth:
  # Existing Zula JWKS (same RSA keys as session JWTs).
  jwks_uri: !env PS_JWKS_URI
  audience:
    - zula

sync_config:
  path: /config/sync-config.yaml

telemetry:
  disable_telemetry_sharing: true
