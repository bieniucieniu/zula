# Local/dev PowerSync Service config (self-hosted).
# Deploy: use a separate service config / secrets (not this file).
replication:
  connections:
    - type: postgresql
      uri: postgresql://powersync_role:powersync@host.docker.internal:5432/zula
      sslmode: disable

storage:
  type: postgresql
  uri: postgresql://powersync:powersync@host.docker.internal:5432/zula_powersync
  sslmode: disable

# Container listens on 8080; host maps 8081:8080 (Ktor owns 8080).
port: 8080

client_auth:
  # Existing Zula JWKS (same RSA keys as session JWTs).
  jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
  audience:
    - zula

sync_config:
  path: /config/sync-config.yaml

telemetry:
  disable_telemetry_sharing: true
