# PowerSync Service only. Source + bucket DBs live in devenv Postgres
# (zula + zula_powersync). Requires: devenv postgres up with wal_level=logical
# + initialSQL (powersync_role / publication), Ktor JWKS reachable for auth.
services:
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    ports:
      - "8081:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI:-postgresql://powersync_role:powersync@host.docker.internal:5432/zula}
      PS_STORAGE_URI: ${PS_STORAGE_URI:-postgresql://powersync:powersync@host.docker.internal:5432/zula_powersync}
      PS_JWKS_URI: ${PS_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
    volumes:
      - ./service.yaml:/config/service.yaml:ro
      - ./sync-config.yaml:/config/sync-config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8080/probes/readiness || wget -q -O- http://127.0.0.1:8080/probes/readiness || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
